name: build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: xcodebuild -project NoteTaker.xcodeproj -scheme NoteTaker -configuration Debug CODE_SIGNING_ALLOWED=NO test
