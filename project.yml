name: NoteTaker
options:
  bundleIdPrefix: com.agilemindset
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 15.0
targets:
  NoteTaker:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - NoteTaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agilemindset.notetaker
        PRODUCT_NAME: NoteTaker
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.5.2
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: NoteTaker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: NoteTaker records your microphone to create a local meeting scribe.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: NoteTaker transcribes recorded meeting audio locally on this Mac.
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: NoteTaker captures screen and system audio from calls and meetings.
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: NoteTaker captures system audio from calls and meetings to include spoken content in the local meeting scribe.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: NoteTaker reads upcoming calendar events to recognize Teams, Zoom, and Google Meet calls and remind you before they begin.
  NoteTakerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - NoteTakerTests
    dependencies:
      - target: NoteTaker
