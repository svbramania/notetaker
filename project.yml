name: NoteTaker
options:
  bundleIdPrefix: com.agilemindset
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 14.0
targets:
  NoteTaker:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - NoteTaker
    info:
      path: NoteTaker/Info.plist
      properties:
        CFBundleDisplayName: NoteTaker
        CFBundleName: NoteTaker
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.2.2"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: NoteTaker records your microphone to create a local meeting scribe.
        NSSpeechRecognitionUsageDescription: NoteTaker transcribes recorded meeting audio locally on this Mac.
        NSScreenCaptureUsageDescription: NoteTaker captures system audio from calls and meetings.
        NSAudioCaptureUsageDescription: NoteTaker captures system audio from calls and meetings to include spoken content in the local meeting scribe.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agilemindset.notetaker
        PRODUCT_NAME: NoteTaker
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
